<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>YouTube Shorts — Painel de Agendamentos</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Segoe UI', system-ui, sans-serif;
    background: #0f0f0f;
    color: #e8e8e8;
    min-height: 100vh;
  }

  /* ── Header ── */
  header {
    background: linear-gradient(135deg, #ff0000 0%, #cc0000 100%);
    padding: 20px 20px;
    display: flex;
    align-items: center;
    gap: 12px;
    box-shadow: 0 4px 20px rgba(255,0,0,0.3);
  }
  header svg.logo { width: 32px; height: 32px; fill: white; flex-shrink: 0; }
  header h1 { font-size: 1.2rem; font-weight: 700; color: white; }
  header p  { font-size: 0.78rem; color: rgba(255,255,255,0.8); margin-top: 2px; }

  .header-right {
    margin-left: auto;
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 8px;
  }

  .last-update {
    font-size: 0.72rem;
    color: rgba(255,255,255,0.75);
    text-align: right;
    line-height: 1.4;
  }

  .btn-run {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: rgba(255,255,255,0.15);
    border: 1px solid rgba(255,255,255,0.35);
    color: white;
    font-size: 0.82rem;
    font-weight: 600;
    padding: 7px 14px;
    border-radius: 8px;
    cursor: pointer;
    transition: background 0.2s, transform 0.1s;
    white-space: nowrap;
  }
  .btn-run:hover  { background: rgba(255,255,255,0.25); }
  .btn-run:active { transform: scale(0.97); }
  .btn-run:disabled { opacity: 0.5; cursor: not-allowed; }
  .btn-run svg { width: 13px; height: 13px; fill: white; }

  /* ── Toast ── */
  #toast {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%) translateY(80px);
    background: #222;
    color: #e8e8e8;
    padding: 11px 22px;
    border-radius: 10px;
    font-size: 0.86rem;
    font-weight: 500;
    box-shadow: 0 4px 20px rgba(0,0,0,0.5);
    transition: transform 0.3s ease;
    z-index: 9999;
    white-space: nowrap;
    border-left: 4px solid #ff4444;
    max-width: 90vw;
    white-space: normal;
    text-align: center;
  }
  #toast.show    { transform: translateX(-50%) translateY(0); }
  #toast.success { border-left-color: #50cc50; }
  #toast.error   { border-left-color: #ff4444; }

  /* ── Layout ── */
  .container { max-width: 1100px; margin: 0 auto; padding: 24px 16px; }

  /* ── Stats ── */
  .stats {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 12px;
    margin-bottom: 28px;
  }
  .stat-card {
    background: #1a1a1a;
    border: 1px solid #2a2a2a;
    border-radius: 12px;
    padding: 16px;
    text-align: center;
  }
  .stat-card .number {
    font-size: 2rem;
    font-weight: 800;
    color: #ff4444;
    line-height: 1;
    margin-bottom: 5px;
  }
  .stat-card .label {
    font-size: 0.72rem;
    color: #888;
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }

  /* ── Section title ── */
  .section-title {
    font-size: 0.9rem;
    font-weight: 600;
    color: #aaa;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    margin-bottom: 14px;
    padding-bottom: 8px;
    border-bottom: 1px solid #222;
  }

  /* ── Cards ── */
  .cards { display: flex; flex-direction: column; gap: 12px; }

  .card {
    background: #1a1a1a;
    border: 1px solid #2a2a2a;
    border-radius: 14px;
    overflow: hidden;
    transition: border-color 0.2s;
  }
  .card:hover { border-color: #ff4444; }

  /* Desktop: 3 colunas */
  .card-inner {
    display: grid;
    grid-template-columns: 130px 1fr auto;
    align-items: stretch;
  }

  .card-thumb {
    width: 130px;
    height: 90px;
    object-fit: cover;
    background: #111;
    display: block;
  }
  .card-thumb-placeholder {
    width: 130px;
    height: 90px;
    background: #222;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #444;
    font-size: 1.8rem;
  }

  .card-body {
    padding: 12px 16px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 5px;
    overflow: hidden;
    min-width: 0;
  }
  .card-title {
    font-size: 0.92rem;
    font-weight: 600;
    color: #f0f0f0;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .card-caption {
    font-size: 0.8rem;
    color: #bbb;
    line-height: 1.4;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .card-file {
    font-size: 0.7rem;
    color: #555;
    margin-top: 2px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  /* Desktop side */
  .card-side {
    padding: 12px 16px;
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    justify-content: center;
    gap: 8px;
    border-left: 1px solid #242424;
    min-width: 160px;
    flex-shrink: 0;
  }

  /* Mobile footer — sempre visível */
  .card-footer {
    display: none;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    padding: 10px 12px;
    border-top: 1px solid #222;
    flex-wrap: wrap;
  }
  .card-footer-left  { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .card-footer-right { display: flex; align-items: center; gap: 6px; }

  /* ── Badge ── */
  .badge {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 3px 9px;
    border-radius: 20px;
    font-size: 0.68rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.03em;
    white-space: nowrap;
  }
  .badge-future { background: rgba(255,200,0,0.12); color: #ffc800; border: 1px solid rgba(255,200,0,0.25); }
  .badge-past   { background: rgba(50,205,50,0.12);  color: #50cc50; border: 1px solid rgba(50,205,50,0.25); }

  .scheduled-time {
    font-size: 0.85rem;
    font-weight: 700;
    color: #e0e0e0;
    text-align: right;
    line-height: 1.3;
  }
  .scheduled-time span {
    display: block;
    font-size: 0.7rem;
    font-weight: 400;
    color: #666;
  }

  /* ── Botões ── */
  .btn-yt {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    background: #ff0000;
    color: white;
    text-decoration: none;
    font-size: 0.75rem;
    font-weight: 600;
    padding: 5px 11px;
    border-radius: 6px;
    transition: background 0.2s;
    white-space: nowrap;
  }
  .btn-yt:hover { background: #cc0000; }

  .btn-edit {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    background: transparent;
    border: 1px solid #444;
    color: #aaa;
    font-size: 0.75rem;
    font-weight: 600;
    padding: 5px 10px;
    border-radius: 6px;
    cursor: pointer;
    transition: border-color 0.2s, color 0.2s;
    white-space: nowrap;
  }
  .btn-edit:hover { border-color: #ff4444; color: #ff4444; }
  .btn-edit svg { width: 11px; height: 11px; }

  /* ── Modal ── */
  .modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.75);
    z-index: 1000;
    align-items: center;
    justify-content: center;
    padding: 16px;
  }
  .modal-overlay.open { display: flex; }

  .modal {
    background: #1e1e1e;
    border: 1px solid #333;
    border-radius: 16px;
    width: 100%;
    max-width: 480px;
    padding: 24px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.6);
    animation: modal-in 0.2s ease;
  }
  @keyframes modal-in { from { opacity:0; transform:scale(0.95); } to { opacity:1; transform:scale(1); } }

  .modal-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 16px;
  }
  .modal-title { font-size: 1rem; font-weight: 700; color: #f0f0f0; }
  .modal-close {
    background: none;
    border: none;
    color: #666;
    font-size: 1.4rem;
    cursor: pointer;
    line-height: 1;
    padding: 2px 6px;
  }
  .modal-close:hover { color: #fff; }

  .modal-label {
    font-size: 0.8rem;
    color: #888;
    margin-bottom: 8px;
  }
  .modal-textarea {
    width: 100%;
    background: #111;
    border: 1px solid #333;
    border-radius: 10px;
    color: #f0f0f0;
    font-size: 0.9rem;
    font-family: inherit;
    padding: 12px;
    resize: vertical;
    min-height: 100px;
    outline: none;
    transition: border-color 0.2s;
  }
  .modal-textarea:focus { border-color: #ff4444; }

  .modal-counter {
    font-size: 0.72rem;
    color: #555;
    text-align: right;
    margin-top: 4px;
    margin-bottom: 16px;
  }
  .modal-counter.warn { color: #ff8800; }
  .modal-counter.over { color: #ff4444; }

  .modal-actions {
    display: flex;
    gap: 10px;
    justify-content: flex-end;
  }
  .btn-cancel {
    background: transparent;
    border: 1px solid #444;
    color: #aaa;
    font-size: 0.85rem;
    font-weight: 600;
    padding: 8px 18px;
    border-radius: 8px;
    cursor: pointer;
    transition: border-color 0.2s;
  }
  .btn-cancel:hover { border-color: #666; color: #fff; }
  .btn-save {
    background: #ff0000;
    border: none;
    color: white;
    font-size: 0.85rem;
    font-weight: 700;
    padding: 8px 20px;
    border-radius: 8px;
    cursor: pointer;
    transition: background 0.2s, transform 0.1s;
  }
  .btn-save:hover   { background: #cc0000; }
  .btn-save:active  { transform: scale(0.97); }
  .btn-save:disabled { opacity: 0.5; cursor: not-allowed; }

  /* ── Empty / Loading ── */
  .empty {
    text-align: center;
    padding: 70px 20px;
    color: #444;
  }
  .empty svg { width: 56px; height: 56px; fill: #333; margin-bottom: 14px; }
  .empty h2  { color: #555; font-size: 1rem; margin-bottom: 8px; }
  .empty p   { font-size: 0.82rem; }
  .loading   { text-align: center; padding: 70px; color: #555; font-size: 0.9rem; }

  /* ── Responsive ── */
  @media (max-width: 640px) {
    .stats { grid-template-columns: repeat(2, 1fr); }

    .card-inner { grid-template-columns: 90px 1fr; }
    .card-thumb, .card-thumb-placeholder { width: 90px; height: 75px; }

    /* Esconde side no mobile */
    .card-side { display: none; }

    /* Mostra footer no mobile */
    .card-footer { display: flex; }

    header h1 { font-size: 1rem; }
    .last-update { display: none; }
    .btn-run span { display: none; }
  }
</style>
</head>
<body>

<header>
  <svg class="logo" viewBox="0 0 24 24"><path d="M23.5 6.19a3.02 3.02 0 0 0-2.12-2.14C19.54 3.5 12 3.5 12 3.5s-7.54 0-9.38.55A3.02 3.02 0 0 0 .5 6.19C0 8.04 0 12 0 12s0 3.96.5 5.81a3.02 3.02 0 0 0 2.12 2.14C4.46 20.5 12 20.5 12 20.5s7.54 0 9.38-.55a3.02 3.02 0 0 0 2.12-2.14C24 15.96 24 12 24 12s0-3.96-.5-5.81zM9.75 15.02V8.98L15.5 12l-5.75 3.02z"/></svg>
  <div>
    <h1>YouTube Shorts — Agendamentos</h1>
    <p>Painel automático de controle</p>
  </div>
  <div class="header-right">
    <div class="last-update" id="last-update">Carregando...</div>
    <button class="btn-run" id="btn-run" onclick="handleRun()">
      <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
      <span>Disparar agora</span>
    </button>
  </div>
</header>

<div id="toast"></div>

<!-- Modal editar legenda -->
<div class="modal-overlay" id="modal-overlay" onclick="closeModal(event)">
  <div class="modal" role="dialog" aria-modal="true">
    <div class="modal-header">
      <span class="modal-title">✏️ Editar legenda</span>
      <button class="modal-close" onclick="closeModal()">&times;</button>
    </div>
    <div class="modal-label">Nova legenda (também será o título no YouTube)</div>
    <textarea class="modal-textarea" id="modal-input" maxlength="100" oninput="updateCounter()"></textarea>
    <div class="modal-counter" id="modal-counter">0 / 100</div>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeModal()">Cancelar</button>
      <button class="btn-save"   id="btn-save" onclick="saveCaption()">Salvar</button>
    </div>
  </div>
</div>

<div class="container">
  <div id="root"><div class="loading">Carregando relatório...</div></div>
</div>

<script>
const REPORT_URL = 'https://raw.githubusercontent.com/assessoriafindjubs-ai/youtube-shorts-scheduler/main/report.json';

let currentVideoId = null;

// ── Toast ────────────────────────────────────────────────────────────────────
let toastTimer;
function showToast(msg, type = 'success') {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = `show ${type}`;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { el.className = ''; }, 4000);
}

// ── Disparar workflow ─────────────────────────────────────────────────────────
async function handleRun() {
  const btn = document.getElementById('btn-run');
  btn.disabled = true;
  btn.querySelector('span').textContent = 'Disparando...';
  try {
    const res  = await fetch('/api/trigger', { method: 'POST' });
    const data = await res.json().catch(() => ({}));
    if (res.ok) showToast('Workflow disparado! Aguarde ~1 min.', 'success');
    else        showToast(`Erro: ${data.error || 'tente novamente'}`, 'error');
  } catch(e) {
    showToast('Falha: ' + e.message, 'error');
  } finally {
    btn.disabled = false;
    btn.querySelector('span').textContent = 'Disparar agora';
  }
}

// ── Modal editar legenda ──────────────────────────────────────────────────────
function openModal(videoId, currentCaption) {
  currentVideoId = videoId;
  const input = document.getElementById('modal-input');
  input.value = currentCaption;
  updateCounter();
  document.getElementById('modal-overlay').classList.add('open');
  setTimeout(() => input.focus(), 50);
}

function closeModal(e) {
  if (e && e.target !== document.getElementById('modal-overlay')) return;
  document.getElementById('modal-overlay').classList.remove('open');
  currentVideoId = null;
}

function updateCounter() {
  const input   = document.getElementById('modal-input');
  const counter = document.getElementById('modal-counter');
  const len = input.value.length;
  counter.textContent = `${len} / 100`;
  counter.className = 'modal-counter' + (len > 90 ? ' over' : len > 70 ? ' warn' : '');
}

async function saveCaption() {
  const newTitle = document.getElementById('modal-input').value.trim();
  if (!newTitle) { showToast('A legenda não pode ser vazia.', 'error'); return; }
  if (!currentVideoId) return;

  const btn = document.getElementById('btn-save');
  btn.disabled = true;
  btn.textContent = 'Salvando...';

  try {
    const res  = await fetch('/api/update-caption', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ videoId: currentVideoId, newTitle }),
    });
    const data = await res.json().catch(() => ({}));

    if (res.ok) {
      document.getElementById('modal-overlay').classList.remove('open');
      showToast('Legenda atualizada! O YouTube processa em ~30 s.', 'success');
      setTimeout(render, 35000); // recarrega após o workflow terminar
    } else {
      showToast(`Erro: ${data.error || 'tente novamente'}`, 'error');
    }
  } catch(e) {
    showToast('Falha: ' + e.message, 'error');
  } finally {
    btn.disabled = false;
    btn.textContent = 'Salvar';
  }
}

// ── Datas ────────────────────────────────────────────────────────────────────
function fmtDate(iso) {
  return new Date(iso).toLocaleDateString('pt-BR', {
    day:'2-digit', month:'2-digit', year:'numeric', timeZone:'America/Sao_Paulo'
  });
}
function fmtTime(iso) {
  return new Date(iso).toLocaleTimeString('pt-BR', {
    hour:'2-digit', minute:'2-digit', timeZone:'America/Sao_Paulo'
  });
}
function fmtDateTime(iso) {
  return new Date(iso).toLocaleString('pt-BR', {
    day:'2-digit', month:'2-digit', year:'numeric',
    hour:'2-digit', minute:'2-digit', timeZone:'America/Sao_Paulo'
  });
}
function isPast(iso) { return new Date(iso) < new Date(); }

// ── Render ────────────────────────────────────────────────────────────────────
function buildStats(videos) {
  const total     = videos.length;
  const published = videos.filter(v => isPast(v.scheduled_for)).length;
  const pending   = total - published;
  const next      = videos.find(v => !isPast(v.scheduled_for));
  return `
    <div class="stats">
      <div class="stat-card">
        <div class="number">${total}</div>
        <div class="label">Total</div>
      </div>
      <div class="stat-card">
        <div class="number">${published}</div>
        <div class="label">Publicados</div>
      </div>
      <div class="stat-card">
        <div class="number">${pending}</div>
        <div class="label">Aguardando</div>
      </div>
      <div class="stat-card">
        <div class="number" style="font-size:1.4rem">${next ? fmtTime(next.scheduled_for) : '—'}</div>
        <div class="label">${next ? 'Próximo · ' + fmtDate(next.scheduled_for) : 'Sem próximo'}</div>
      </div>
    </div>`;
}

function buildCard(v) {
  const past  = isPast(v.scheduled_for);
  const badge = past
    ? `<span class="badge badge-past">✓ Publicado</span>`
    : `<span class="badge badge-future">⏰ Agendado</span>`;

  const dateHtml = `
    <div class="scheduled-time">
      ${fmtDate(v.scheduled_for)}
      <span>${fmtTime(v.scheduled_for)} (Brasília)</span>
    </div>`;

  const ytBtn  = `<a class="btn-yt" href="${v.url}" target="_blank">
    <svg width="11" height="11" viewBox="0 0 24 24" fill="white"><path d="M23.5 6.19a3.02 3.02 0 0 0-2.12-2.14C19.54 3.5 12 3.5 12 3.5s-7.54 0-9.38.55A3.02 3.02 0 0 0 .5 6.19C0 8.04 0 12 0 12s0 3.96.5 5.81a3.02 3.02 0 0 0 2.12 2.14C4.46 20.5 12 20.5 12 20.5s7.54 0 9.38-.55a3.02 3.02 0 0 0 2.12-2.14C24 15.96 24 12 24 12s0-3.96-.5-5.81zM9.75 15.02V8.98L15.5 12l-5.75 3.02z"/></svg>
    Ver no YouTube
  </a>`;

  const editBtn = `<button class="btn-edit" onclick="openModal('${v.id}', ${JSON.stringify(v.caption || v.title)})">
    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04a1 1 0 0 0 0-1.41l-2.34-2.34a1 1 0 0 0-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/></svg>
    Editar
  </button>`;

  const thumbHtml = v.thumbnail
    ? `<img class="card-thumb" src="${v.thumbnail}" alt="thumb" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">`
    : '';

  return `
    <div class="card">
      <div class="card-inner">
        ${thumbHtml}
        <div class="card-thumb-placeholder" style="display:${v.thumbnail ? 'none' : 'flex'}">▶</div>
        <div class="card-body">
          <div class="card-title">${v.title}</div>
          <div class="card-caption">${v.caption || v.title}</div>
          <div class="card-file">📁 ${v.drive_file}</div>
        </div>
        <div class="card-side">
          ${badge}
          ${dateHtml}
          ${editBtn}
          ${ytBtn}
        </div>
      </div>
      <!-- Footer visível só no mobile -->
      <div class="card-footer">
        <div class="card-footer-left">
          ${badge}
          <span style="font-size:0.8rem;font-weight:700;color:#e0e0e0">${fmtDate(v.scheduled_for)} · ${fmtTime(v.scheduled_for)}</span>
        </div>
        <div class="card-footer-right">
          ${editBtn}
          ${ytBtn}
        </div>
      </div>
    </div>`;
}

async function render() {
  try {
    const res    = await fetch(REPORT_URL + '?t=' + Date.now());
    const data   = await res.json();
    const videos = data.videos || [];

    document.getElementById('last-update').innerHTML =
      `Atualizado<br><strong>${data.last_updated ? fmtDateTime(data.last_updated) : '—'}</strong>`;

    if (videos.length === 0) {
      document.getElementById('root').innerHTML = `
        <div class="empty">
          <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/></svg>
          <h2>Nenhum vídeo agendado ainda</h2>
          <p>Coloque um vídeo na pasta <strong>Shorts</strong> do Google Drive e aguarde!</p>
        </div>`;
      return;
    }

    document.getElementById('root').innerHTML =
      buildStats(videos) +
      `<div class="section-title">Vídeos agendados</div>` +
      `<div class="cards">${videos.map(buildCard).join('')}</div>`;

  } catch(e) {
    document.getElementById('root').innerHTML = `
      <div class="empty">
        <h2>Erro ao carregar relatório</h2>
        <p>${e.message}</p>
      </div>`;
  }
}

// Fecha modal com Escape
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') document.getElementById('modal-overlay').classList.remove('open');
});

render();
setInterval(render, 60000);
</script>
</body>
